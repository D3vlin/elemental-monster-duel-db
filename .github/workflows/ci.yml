name: DB CI
run-name: DB CI

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: db-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-init-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify init scripts match ddl/ and dml/ sources
        run: bash ci/verify_init_sync.sh
